[project]
name = "bebebendle-bot"
version = "0.1.0"
description = "Telegram bot for bebebendle - daily food comparison game"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0.0",
    "aiofiles>=24.0.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "scipy>=1.10.0",
    "sentence-transformers>=5.5.1",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.uv]
package = false


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true
exclude = ["src/__init__\\.py"]

[[tool.mypy.overrides]]
module = [
    "aiofiles",
    "aiofiles.*",
    "asyncpg",
    "asyncpg.*",
    "scipy",
    "scipy.*",
    "sentence_transformers",
    "sentence_transformers.*",
]
ignore_missing_imports = true
