# Temporary HTTP-only vhost for ACME + plain proxy before cert exists.
# Replaced by bebebendle.svagaplus.qzz.io.conf after certbot.

server {
    listen 80;
    listen [::]:80;
    server_name bebebendle.svagaplus.qzz.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Block internal APIs even on HTTP bootstrap
    location ^~ /api/internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
