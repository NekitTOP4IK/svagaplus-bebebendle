services:
  next:
    build:
      context: ./next
      dockerfile: Dockerfile
    container_name: bebebendle-next
    ports:
      # Loopback-only: nginx on the host proxies to 127.0.0.1:3000, and exposing
      # the app directly would let clients spoof X-Forwarded-For for rate limits.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    extra_hosts:
      # Reach host SVAGA+ (gunicorn on :5016) from the container network.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
      - ./next/public/uploads:/app/public/uploads
      - next-cache:/app/.next/cache
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: bebebendle-bot
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    depends_on:
      - next
      - db
      - redis

  db:
    image: postgres:15
    container_name: bebebendle-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      # Loopback-only: enough for host tooling (DATABASE_URL 127.0.0.1:5432),
      # while the DB itself stays unreachable from the outside.
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bebebendle-redis
    # Host 6379 is often already taken by a local Redis; keep Redis internal-only.
    # ports:
    #   - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  next-cache:
  postgres_data:
  pgadmin_data:
  redis_data:
